<!-- 폰트: @import 대신 <link> + preconnect로 더 빨리 로드 -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --s-paper:#FAF9F5;
    --s-ink:#201D19;
    --s-ink-soft:#726B5E;
    --s-line:#E7E2D7;
    --s-brass:#8A6A2E;
    /* 한글 폴백을 모든 폰트 스택에 포함 — 영문 전용 폰트(JetBrains Mono)에서도
       한글은 Pretendard/맑은 고딕으로 표시되어 굴림(체)로 떨어지지 않음 */
    --font-sans:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    --font-mono:'JetBrains Mono','Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none !important;}
  html{background:var(--s-paper);}
  html.modal-open{overflow:hidden;}
  body{min-height:100vh;overflow-x:hidden;color:#1a1a1a;font-family:var(--font-sans);background:var(--s-paper);}
  button{font:inherit;background:none;color:inherit;}
  a{color:inherit;text-decoration:none;}

  a:focus-visible, button:focus-visible{outline:2px solid var(--s-brass);outline-offset:3px;border-radius:2px;}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important;
      animation-delay:0s !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }

  /* ================= 화면 전환 토글 ================= */
  .mode-switch{
    position:fixed;top:1.1rem;right:1.1rem;z-index:600;
    display:inline-grid;grid-template-columns:1fr 1fr;
    background:#fff;border:1px solid #e0e0e0;
    border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .mode-switch button{
    position:relative;z-index:2;border:none;cursor:pointer;text-align:center;
    font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;
    padding:.5rem .9rem;border-radius:999px;color:#999;
    transition:color .35s ease;
  }
  .mode-switch button.active{color:#fff;}
  .mode-switch .thumb{
    position:absolute;top:3px;left:3px;bottom:3px;width:calc(50% - 3px);
    background:#1a1a1a;border-radius:999px;
    transition:transform .4s cubic-bezier(.65,0,.35,1);z-index:1;
  }
  .mode-switch[data-active="report"] .thumb{transform:translateX(100%);}

  @media (max-width:520px){
    .mode-switch{top:.7rem;right:.7rem;}
    .mode-switch button{padding:.42rem .65rem;font-size:.6rem;}
  }

  /* ================= 패치 노트 모달 ================= */
  .patch-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:690;opacity:0;
    transition:opacity .35s ease;pointer-events:none;
  }
  .patch-backdrop.show{opacity:1;pointer-events:auto;}

  .patch-banner{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);
    width:min(90vw, 440px);max-height:min(80vh, 520px);overflow-y:auto;
    background:#1a1a1a;color:#fff;border-radius:14px;
    padding:1.6rem 1.5rem 1.5rem;outline:none;
    box-shadow:0 24px 60px rgba(0,0,0,.35);z-index:700;opacity:0;
    transition:opacity .35s ease, transform .35s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  .patch-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;}
  .patch-banner-label{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#d4af5a;margin-bottom:.5rem;}
  .patch-banner-title{font-size:1.15rem;font-weight:600;margin-bottom:.6rem;padding-right:1.5rem;word-break:keep-all;}
  .patch-banner-body{font-size:.86rem;line-height:1.6;color:#ccc;word-break:keep-all;overflow-wrap:anywhere;}
  .patch-banner-body ul{padding-left:1.1rem;margin:.4rem 0;}
  .patch-banner-body h4{font-size:.9rem;margin:.6rem 0 .25rem;color:#fff;}
  .patch-banner-close{
    position:absolute;top:1rem;right:1.1rem;
    border:none;color:#999;font-size:1.4rem;line-height:1;cursor:pointer;
    padding:.1rem .3rem;transition:color .2s ease;
  }

  @media (max-width:520px){
    .patch-banner{width:88vw;padding:1.3rem 1.2rem 1.2rem;}
  }

  /* ================= SIMPLE 화면 ================= */
  #app-simple{min-height:100vh;}

  .s-wrap{max-width:600px;margin:0 auto;padding:5.5rem 1.75rem 4rem;}

  .s-header{margin-bottom:2.5rem;}
  .s-brand{display:flex;align-items:center;gap:.55rem;margin-bottom:.6rem;}
  .s-brand svg{width:20px;height:20px;flex:none;color:var(--s-ink);}
  .s-brand span{font-size:1.28rem;font-weight:600;letter-spacing:-0.01em;color:var(--s-ink);}
  .s-tag{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;color:var(--s-ink-soft);}

  .s-tabs{display:flex;gap:1.5rem;border-bottom:1px solid var(--s-line);margin-bottom:1.5rem;}
  .s-tabs button{
    font-family:var(--font-mono);font-size:.82rem;letter-spacing:.03em;
    color:var(--s-ink-soft);border:none;cursor:pointer;
    padding:.2rem 0 .85rem;border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:color .25s ease, border-color .25s ease;
  }
  .s-tabs button.active{color:var(--s-ink);border-color:var(--s-brass);}

  .s-subtabs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.75rem;animation:sFadeDown .35s ease both;}
  .s-subtabs button{
    font-family:var(--font-mono);font-size:.74rem;letter-spacing:.02em;
    border:1px solid var(--s-line);border-radius:999px;background:#fff;color:var(--s-ink-soft);
    cursor:pointer;padding:.4rem .95rem;transition:all .25s ease;
  }
  .s-subtabs button.active{background:var(--s-brass);border-color:var(--s-brass);color:#fff;}

  @keyframes sFadeDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

  .s-list{list-style:none;min-height:90px;}
  .s-item{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--s-line);opacity:0;animation:sItemIn .45s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i, 0) * 45ms);}
  .s-list li:last-child{border-bottom:none;}
  @keyframes sItemIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .s-item-body{display:flex;align-items:baseline;gap:.85rem;min-width:0;}
  .s-item-year{flex:none;width:2.6rem;text-align:right;font-family:var(--font-mono);font-size:.72rem;font-weight:600;color:var(--s-brass);letter-spacing:.02em;}
  .s-item-text{min-width:0;}
  .s-item-name{font-size:.98rem;font-weight:600;color:var(--s-ink);margin-bottom:.2rem;word-break:keep-all;overflow-wrap:anywhere;}
  .s-item-desc{font-size:.8rem;color:var(--s-ink-soft);line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;}

  .s-btn{
    flex:none;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.03em;
    border:1px solid var(--s-ink);background:#fff;color:var(--s-ink);
    padding:.5rem 1.05rem;border-radius:5px;cursor:pointer;
    transition:all .25s ease;
  }

  .s-empty{padding:2.5rem 0;text-align:center;color:#b3ab9c;font-size:.86rem;font-family:var(--font-mono);}

  .s-footer{margin-top:3.5rem;padding-top:1.5rem;border-top:1px solid var(--s-line);font-family:var(--font-mono);font-size:.72rem;color:#b3ab9c;}
  .s-footer a{text-decoration:underline;text-underline-offset:2px;}

  @media (max-width:520px){
    .s-wrap{padding:4.5rem 1.25rem 3rem;}
    .s-tabs{gap:1.1rem;}
    .s-item-year{width:2.2rem;font-size:.68rem;}
  }

  /* ================= REPORT 화면 (문의) ================= */
  .r-wrap{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem;gap:1.1rem;
  }
  .r-icon{width:40px;height:40px;color:var(--s-brass);}
  .r-icon svg{width:100%;height:100%;}
  .r-title{font-size:1.4rem;font-weight:600;color:var(--s-ink);}
  .r-desc{font-size:.9rem;color:var(--s-ink-soft);line-height:1.7;max-width:320px;word-break:keep-all;}
  .r-btn{
    margin-top:.6rem;font-family:var(--font-mono);font-size:.85rem;letter-spacing:.03em;
    border:1px solid var(--s-ink);background:#fff;color:var(--s-ink);
    padding:.85rem 2.1rem;border-radius:6px;cursor:pointer;
    transition:all .25s ease;
  }
  .r-alt{font-size:.76rem;color:#b3ab9c;line-height:1.8;}
  .r-alt .r-link{border:none;cursor:pointer;color:var(--s-ink-soft);text-decoration:underline;text-underline-offset:2px;padding:0 .15rem;}

  /* 호버 효과는 마우스가 있는 기기에서만 — 모바일에서 탭한 버튼이 색칠된 채 남는 문제 방지 */
  @media (hover:hover){
    .patch-banner-close:hover{color:#fff;}
    .s-tabs button:hover{color:var(--s-ink);}
    .s-subtabs button:not(.active):hover{border-color:var(--s-brass);color:var(--s-ink);}
    .s-btn:hover, .r-btn:hover{background:var(--s-brass);border-color:var(--s-brass);color:#fff;}
    .r-alt .r-link:hover{color:var(--s-ink);}
  }
</style>
</head>

<script>
/* =========================================================
   ⚙️ 설정
   - items.txt는 이 페이지와 같은 repo(GitHub Pages)에서 바로 읽으므로 설정 불필요
   - 아래 GitHub 정보는 "패치 노트(Release)"에만 사용됩니다
   ========================================================= */
const GITHUB_OWNER  = 'nkxwert';  // 예: octocat
const GITHUB_REPO   = 'weeamusic';        // 예: weea-music-site
const GITHUB_BRANCH = 'main';                  // 기본 브랜치 이름 (보통 main)
const CONTACT_EMAIL = 'rgsnoah1150@gmail.com';
const MAIL_SUBJECT  = 'Music Resources 문의';

const GITHUB_CONFIGURED = !GITHUB_OWNER.startsWith('YOUR_') && !GITHUB_REPO.startsWith('YOUR_');
const RELEASES_API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/latest`;
const ITEMS_SOURCES = ['items.txt']; // 1순위: 같은 사이트(GitHub Pages)의 items.txt
if(GITHUB_CONFIGURED){             // 2순위: 로컬에서 파일로 열었을 때 등을 위한 raw 주소
  ITEMS_SOURCES.push(`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/items.txt`);
}
const SEEN_RELEASE_KEY = 'weea_last_seen_release';
const NEW_VISITOR_WINDOW_DAYS = 7; // 처음 방문한 사람에게도 최근 N일 안의 패치 노트는 보여줌

/* =========================================================
   SITE_DATA — 화면이 읽는 데이터.
   평소에는 items.txt 내용으로 덮어써지고, 불러오기에 실패했을 때만
   아래 기본값이 그대로 표시됩니다.
   ========================================================= */
let SITE_DATA = {
  sheetMusic: {
    items: [] },
  textbook: { items: [] },
  audio: {
    groups: [] },
      { key:"covenant", label:"언약과 꿈", items:[] },
      { key:"etc", label:"기타", items:[] }
    ]
  }
};

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function countItems(data){
  return data.sheetMusic.items.length + data.textbook.items.length
    + data.audio.groups.reduce((sum, g) => sum + g.items.length, 0);
}

async function fetchWithTimeout(url, options = {}, ms = 8000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try{ return await fetch(url, { ...options, signal: ctrl.signal }); }
  finally{ clearTimeout(timer); }
}

/* items.txt 한 줄 형식: 항목|목록|발매연도|제목|설명|링크
   - 항목: 악보 / 교재 / 음원
   - 목록: 음원일 때만 사용 (그루터기 / 언약과꿈 / 기타), 나머지는 - 로 비워두기
   - 발매연도·설명: 없으면 - 로 비워두기
   - 띄어쓰기는 무시 ("언약과 꿈" = "언약과꿈")
   - #으로 시작하는 줄과 빈 줄은 무시 (주석) */
function parseItemsTxt(text){
  const data = {
    sheetMusic: { items: [] },
    textbook: { items: [] },
    audio: { groups: [
      { key:'grooturgy', label:'그루터기',  items:[] },
      { key:'covenant',  label:'언약과 꿈', items:[] },
      { key:'etc',       label:'기타',      items:[] }
    ]}
  };
  const norm = s => s.replace(/\s+/g, '');
  const catKeyByLabel   = { '악보':'sheetMusic', '교재':'textbook', '음원':'audio' };
  const groupKeyByLabel = { '그루터기':'grooturgy', '언약과꿈':'covenant', '기타':'etc' };
  const blank = s => (s === '-' ? '' : s);

  text.replace(/^\uFEFF/, '').split(/\r?\n/).forEach((raw, idx) => {
    const line = raw.trim();
    if(!line || line.startsWith('#')) return;
    const parts = line.split('|').map(s => s.trim());
    if(parts.length !== 6){
      console.warn(`items.txt ${idx+1}번째 줄: 칸이 ${parts.length}개 (6개여야 함) → 건너뜀\n  "${line}"`);
      return;
    }
    const [catRaw, groupRaw, yearRaw, name, descRaw, url] = parts;
    const cat = catKeyByLabel[norm(catRaw)];
    if(!cat){
      console.warn(`items.txt ${idx+1}번째 줄: 항목 '${catRaw}'을(를) 알 수 없음 (악보/교재/음원) → 건너뜀`);
      return;
    }
    if(!name || name === '-'){
      console.warn(`items.txt ${idx+1}번째 줄: 제목이 비어 있음 → 건너뜀`);
      return;
    }
    if(!/^https?:\/\//i.test(url)){
      console.warn(`items.txt ${idx+1}번째 줄: 링크가 http:// 또는 https:// 로 시작하지 않음 → 건너뜀\n  "${url}"`);
      return;
    }
    const item = {
      name,
      desc: blank(descRaw),
      year: blank(yearRaw),
      url,
      label: url.includes('drive.google.com') ? 'Download' : 'Go'
    };
    if(cat === 'audio'){
      const group = data.audio.groups.find(g => g.key === groupKeyByLabel[norm(groupRaw)]);
      if(!group){
        console.warn(`items.txt ${idx+1}번째 줄: 목록 '${groupRaw}'을(를) 알 수 없음 (그루터기/언약과꿈/기타) → 건너뜀`);
        return;
      }
      group.items.push(item);
    } else {
      data[cat].items.push(item);
    }
  });
  return data;
}

async function loadSiteData(){
  for(const src of ITEMS_SOURCES){
    try{
      // ?v= 로 CDN/브라우저 캐시를 우회해서 커밋 내용이 바로 반영되게 함
      const res = await fetchWithTimeout(`${src}?v=${Date.now()}`, { cache:'no-store' });
      if(!res.ok) continue;
      const parsed = parseItemsTxt(await res.text());
      if(countItems(parsed) > 0){ SITE_DATA = parsed; break; }
    }catch(err){
      console.warn(`items.txt 불러오기 실패 (${src}):`, err);
    }
  }
  renderSimpleList();
}

/* ---------------- 패치 노트 ---------------- */
function tinyMarkdown(md){
  if(!md) return '';
  // GitHub 웹에서 작성한 Release 설명은 줄바꿈이 \r\n이라, 먼저 \n으로 통일 (안 하면 리스트 변환이 깨짐)
  let html = escapeHtml(md.replace(/\r\n?/g, '\n').trim());
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^#{1,6} (.*)$/gm, '<h4>$1</h4>');
  html = html.replace(/(^|\n)((?:[-*] .+(?:\n|$))+)/g, (m, pre, list) => {
    const items = list.trim().split('\n').map(l => `<li>${l.replace(/^[-*]\s+/, '')}</li>`).join('');
    return `${pre}<ul>${items}</ul>`;
  });
  html = html.replace(/\n*(<h4>|<ul>)/g, '$1').replace(/(<\/h4>|<\/ul>)\n*/g, '$1');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  return html;
}

async function checkPatchNotes(){
  if(!GITHUB_CONFIGURED) return; // 설정 전이면 API를 부르지 않음
  try{
    // no-cache: 매번 서버에 확인하되 바뀐 게 없으면 304로 받아서 GitHub API 사용량(시간당 60회)을 아낌
    const res = await fetchWithTimeout(RELEASES_API, { cache:'no-cache' });
    if(!res.ok) return; // 릴리즈 없음, 이름 오타, 사용량 초과 등
    const rel = await res.json();
    if(!rel || !rel.tag_name) return;

    let lastSeen = null;
    try{ lastSeen = localStorage.getItem(SEEN_RELEASE_KEY); }catch(e){}

    if(lastSeen === null){
      // 처음 방문: 최근 N일 안에 올라온 패치 노트만 보여주고, 오래된 건 기준점으로만 저장
      const published = Date.parse(rel.published_at || '');
      const isRecent = published && (Date.now() - published) < NEW_VISITOR_WINDOW_DAYS * 864e5;
      if(!isRecent){
        try{ localStorage.setItem(SEEN_RELEASE_KEY, rel.tag_name); }catch(e){}
        return;
      }
    } else if(lastSeen === rel.tag_name){
      return;
    }
    showPatchNoteBanner(rel);
  }catch(err){
    // 네트워크 오류 등은 방문자에게 영향 없이 조용히 무시
  }
}

const patchBanner   = document.getElementById('patchBanner');
const patchBackdrop = document.getElementById('patchBackdrop');
let patchHideTimer = null;
let focusBeforePatch = null;

function showPatchNoteBanner(rel){
  clearTimeout(patchHideTimer);
  document.getElementById('patchBannerTitle').textContent = rel.name || rel.tag_name;
  document.getElementById('patchBannerBody').innerHTML = tinyMarkdown(rel.body);
  patchBanner.dataset.tag = rel.tag_name;
  patchBanner.hidden = false;
  patchBackdrop.hidden = false;
  void patchBanner.offsetWidth; // 강제 리플로우 — 이게 없으면 등장 애니메이션이 생략되는 경우가 있음
  patchBanner.classList.add('show');
  patchBackdrop.classList.add('show');
  document.documentElement.classList.add('modal-open'); // 뒤 페이지 스크롤 잠금
  focusBeforePatch = document.activeElement;
  patchBanner.focus({ preventScroll:true });
}

function dismissPatchNote(){
  if(patchBanner.hidden || !patchBanner.classList.contains('show')) return;
  if(patchBanner.dataset.tag){
    try{ localStorage.setItem(SEEN_RELEASE_KEY, patchBanner.dataset.tag); }catch(e){}
  }
  patchBanner.classList.remove('show');
  patchBackdrop.classList.remove('show');
  document.documentElement.classList.remove('modal-open');
  patchHideTimer = setTimeout(() => { patchBanner.hidden = true; patchBackdrop.hidden = true; }, 350);
  if(focusBeforePatch && typeof focusBeforePatch.focus === 'function'){
    focusBeforePatch.focus({ preventScroll:true });
  }
}

document.getElementById('patchClose').addEventListener('click', dismissPatchNote);
patchBackdrop.addEventListener('click', dismissPatchNote);
document.addEventListener('keydown', e => { if(e.key === 'Escape') dismissPatchNote(); });

/* ---------------- SIMPLE 화면 ---------------- */
const simpleState = { tab:'sheetMusic', sub:null };

function sItemsFor(tab, sub){
  if(tab === 'audio'){
    const g = SITE_DATA.audio.groups.find(g => g.key === sub) || SITE_DATA.audio.groups[0];
    return g.items;
  }
  return SITE_DATA[tab].items;
}

function renderSimpleSubtabs(){
  const el = document.getElementById('sSubtabs');
  if(simpleState.tab !== 'audio'){ el.hidden = true; el.innerHTML = ''; return; }
  if(!simpleState.sub) simpleState.sub = SITE_DATA.audio.groups[0].key;
  el.hidden = false;
  el.innerHTML = SITE_DATA.audio.groups.map(g => {
    const active = g.key === simpleState.sub;
    return `<button type="button" data-sub="${g.key}" class="${active ? 'active' : ''}" aria-pressed="${active}">${escapeHtml(g.label)}</button>`;
  }).join('');
}

function renderSimpleList(){
  renderSimpleSubtabs();
  const list = document.getElementById('sList');
  const items = sItemsFor(simpleState.tab, simpleState.sub);
  if(!items.length){
    list.innerHTML = '<li class="s-empty">아직 등록된 자료가 없습니다.</li>';
    return;
  }
  const showYear = items.some(it => it.year);
  list.innerHTML = items.map((it, i) => `
    <li class="s-item" style="--i:${i}">
      <div class="s-item-body">
        ${showYear ? `<span class="s-item-year">${escapeHtml(it.year || '')}</span>` : ''}
        <div class="s-item-text">
          <div class="s-item-name">${escapeHtml(it.name)}</div>
          ${it.desc ? `<div class="s-item-desc">${escapeHtml(it.desc)}</div>` : ''}
        </div>
      </div>
      <a class="s-btn" href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.label || 'Download')}</a>
    </li>`).join('');
}

document.getElementById('sTabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  simpleState.tab = btn.dataset.tab;
  if(simpleState.tab !== 'audio') simpleState.sub = null;
  document.querySelectorAll('#sTabs button').forEach(b => {
    b.classList.toggle('active', b === btn);
    b.setAttribute('aria-pressed', b === btn);
  });
  renderSimpleList();
});

document.getElementById('sSubtabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-sub]');
  if(!btn) return;
  simpleState.sub = btn.dataset.sub;
  renderSimpleList();
});

document.getElementById('mailBtn').href =

document.getElementById('gmailLink').href =
  `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(CONTACT_EMAIL)}&su=${encodeURIComponent(MAIL_SUBJECT)}`;

document.getElementById('copyEmailBtn').addEventListener('click', async e => {
  const btn = e.currentTarget;
  let ok = false;
  try{
    await navigator.clipboard.writeText(CONTACT_EMAIL);
    ok = true;
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = CONTACT_EMAIL;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove();
  }
  btn.textContent = ok ? '복사됨 ✓' : CONTACT_EMAIL;
  setTimeout(() => { btn.textContent = '주소 복사'; }, 1800);
});

/* ---------------- 화면 전환 (주소창 #report 와 연동 → 휴대폰 뒤로가기 지원) ---------------- */
let pushedReport = false;

function modeFromUrl(){ return location.hash === '#report' ? 'report' : 'simple'; }

function applyMode(mode){
  document.getElementById('app-simple').hidden = mode !== 'simple';
  document.getElementById('app-report').hidden = mode !== 'report';
  const switcher = document.getElementById('modeSwitch');
  switcher.dataset.active = mode;
  switcher.querySelectorAll('button').forEach(b => {
    const active = b.dataset.mode === mode;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active);
  });
  window.scrollTo(0, 0);
}

document.getElementById('modeSwitch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if(!btn) return;
  const mode = btn.dataset.mode;
  if(mode === modeFromUrl()) return;
  if(mode === 'report'){
    history.pushState(null, '', '#report');
    pushedReport = true;
    applyMode('report');
  } else if(pushedReport){
    pushedReport = false;
    history.back(); // popstate에서 화면 전환 → 뒤로가기 기록이 꼬이지 않음
  } else {
    history.replaceState(null, '', location.pathname + location.search);
    applyMode('simple');
  }
});

window.addEventListener('popstate', () => {
  if(modeFromUrl() === 'simple') pushedReport = false;
  applyMode(modeFromUrl());
});
window.addEventListener('hashchange', () => applyMode(modeFromUrl()));

/* ---------------- 초기화 ---------------- */
applyMode(modeFromUrl());
loadSiteData();
checkPatchNotes();
