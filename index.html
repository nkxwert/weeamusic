<style>

  :root{

    --s-ink:#201D19;
    --s-ink-soft:#726B5E;
    --s-line:#E7E2D7;
    --s-brass:#8A6A2E;
    --s-brass-deep:#6B4F1F;

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#ffffff;}
  body{min-height:100vh;overflow-x:hidden;color:#1a1a1a;}
  button{font:inherit;background:none;}
  a{color:inherit;text-decoration:none;}

  a:focus-visible, button:focus-visible{outline:2px solid #1a1a1a;outline-offset:3px;border-radius:2px;}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }

  /* ================= 디자인 전환 토글 (공용) ================= */
  .mode-switch{
    position:fixed;top:1.1rem;right:1.1rem;z-index:600;
    display:inline-flex;background:#fff;border:1px solid #e0e0e0;
    border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .mode-switch button{
    position:relative;z-index:2;border:none;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:.66rem;letter-spacing:.06em;
    padding:.5rem .9rem;border-radius:999px;color:#999;
    transition:color .35s ease;
  }
  .mode-switch button.active{color:#fff;}
  .mode-switch .thumb{
    position:absolute;top:3px;left:3px;bottom:3px;width:calc(50% - 3px);
    background:#1a1a1a;border-radius:999px;
    transition:transform .4s cubic-bezier(.65,0,.35,1);z-index:1;
  }
  .mode-switch[data-active="report"] .thumb{transform:translateX(100%);}

  @media (max-width:520px){
    .mode-switch{top:.7rem;right:.7rem;}
    .mode-switch button{padding:.42rem .65rem;font-size:.6rem;}
  }

  /* ================= 패치 노트 모달 (공용) ================= */
  .patch-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:690;opacity:0;
    transition:opacity .35s ease;pointer-events:none;
  }
  .patch-backdrop.show{opacity:1;pointer-events:auto;}
  .patch-backdrop[hidden]{display:none;}

  .patch-banner{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.92);
    width:min(90vw, 440px);max-height:min(80vh, 520px);overflow-y:auto;
    background:#1a1a1a;color:#fff;border-radius:14px;
    padding:1.6rem 1.5rem 1.5rem;
    box-shadow:0 24px 60px rgba(0,0,0,.35);z-index:700;opacity:0;
    transition:opacity .35s ease, transform .35s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  .patch-banner[hidden]{display:none;}
  .patch-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;}
  .patch-banner-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#d4af5a;margin-bottom:.5rem;}
  .patch-banner-title{font-family:'Pretendard',-apple-system,sans-serif;font-size:1.15rem;font-weight:600;margin-bottom:.6rem;padding-right:1.5rem;}
  .patch-banner-body{font-family:'Pretendard',-apple-system,sans-serif;font-size:.86rem;line-height:1.6;color:#ccc;}
  .patch-banner-body ul{padding-left:1.1rem;margin:.4rem 0;}
  .patch-banner-body h4{font-size:.9rem;margin:.6rem 0 .25rem;color:#fff;}
  .patch-banner-close{
    position:absolute;top:1rem;right:1.1rem;
    background:none;border:none;color:#999;font-size:1.4rem;line-height:1;cursor:pointer;
    padding:.1rem .3rem;transition:color .2s ease;
  }
  .patch-banner-close:hover{color:#fff;}

  @media (max-width:520px){
    .patch-banner{width:88vw;padding:1.3rem 1.2rem 1.2rem;}
  }

  /* =========================================================
     SIMPLE 모드 — 기본 디자인
     ========================================================= */
  #app-simple{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;background:var(--s-paper);min-height:100vh;}

  .s-wrap{max-width:600px;margin:0 auto;padding:5.5rem 1.75rem 4rem;}

  .s-tag{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.08em;color:var(--s-ink-soft);text-transform:uppercase;}

  .s-tabs{display:flex;gap:1.5rem;border-bottom:1px solid var(--s-line);margin-bottom:1.5rem;}
  .s-tabs button{
    font-family:'JetBrains Mono',monospace;font-size:.82rem;letter-spacing:.03em;
    color:var(--s-ink-soft);border:none;cursor:pointer;

  .s-tabs button.active{color:var(--s-ink);border-color:var(--s-brass);}

  .s-subtabs button.active{background:var(--s-brass);border-color:var(--s-brass);color:#fff;}

  @keyframes sFadeDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

  .s-list{list-style:none;min-height:90px;}
  .s-item{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--s-line);opacity:0;animation:sItemIn .45s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(var(--i, 0) * 45ms);}
  .s-list li:last-child{border-bottom:none;}
  @keyframes sItemIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .s-item-body{display:flex;align-items:baseline;gap:.85rem;min-width:0;}
  .s-item-year{flex:none;width:2.6rem;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:600;color:var(--s-brass);letter-spacing:.02em;}

  .s-item-name{font-size:.98rem;font-weight:600;color:var(--s-ink);margin-bottom:.2rem;}

  .s-btn{
    flex:none;font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.03em;

    padding:.5rem 1.05rem;border-radius:5px;cursor:pointer;

  }
  .s-btn:hover{background:var(--s-brass);border-color:var(--s-brass);color:#fff;}

  .s-empty{padding:2.5rem 0;text-align:center;color:#b3ab9c;font-size:.86rem;font-family:'JetBrains Mono',monospace;}

  #app-report .r-btn{

    transition:all .25s ease;
  }
  #app-report .r-btn:hover{background:var(--s-brass);border-color:var(--s-brass);color:#fff;}
</style>

<script>
/* =========================================================
   ⚙️ 설정 — 본인 GitHub 정보로 수정하세요
   ========================================================= */
const GITHUB_OWNER  = 'YOUR_GITHUB_USERNAME';  // 예: octocat
const GITHUB_REPO   = 'YOUR_REPO_NAME';        // 예: weea-music-site
const GITHUB_BRANCH = 'main';                  // 기본 브랜치 이름 (보통 main)
const ITEMS_TXT_URL = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/items.txt`;
const RELEASES_API  = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/latest`;
const SEEN_RELEASE_KEY = 'weea_last_seen_release';

/* =========================================================
   SITE_DATA — 단일 데이터 소스.
   평소에는 GitHub의 items.txt를 읽어서 자동으로 채워지고,
   fetch가 실패할 때만 아래 FALLBACK_DATA가 대신 쓰입니다.
   ========================================================= */
let SITE_DATA = {
  sheetMusic: {
    items: [

      { name:"찬양선교총국", desc:"더 많은 악보는 이 사이트를 방문하세요.", year:"", url:"http://www.praise237.com/index.php", label:"Go" }
    ]
  },
  textbook: {
    items: []
  },
  audio: {
    groups: [
      { key:"grooturgy", containerId:"audioGrooturgy", label:"그루터기", items:[
        { name:"그루터기 25집", desc:"세계복음화전도협회에서 발매한 그루터기 25집입니다", year:"2025", url:"https://drive.google.com/drive/folders/1FUrImpVuOgXI7oJerSoT4DC_YXyR4sk1?usp=sharing" },
        { name:"그루터기 19집", desc:"세계복음화전도협회에서 발매", year:"2019", url:"https://drive.google.com/drive/folders/160Md4jZ8IyK4C7xHx6AeDsbqW2cbRq1Z" },
        { name:"그루터기 13집", desc:"세계복음화전도협회에서 발매", year:"2013", url:"https://drive.google.com/drive/folders/16D8_yz29PZkvbrp0BjaZjO-SZxgQL9Vj" },
        { name:"그루터기 12집", desc:"세계복음화전도협회에서 발매", year:"2012", url:"https://drive.google.com/drive/folders/136Ksb9S2pnc3YSFyqM3gciCbJlj-o65r" },
        { name:"그루터기 11집", desc:"세계복음화전도협회에서 발매", year:"2011", url:"https://drive.google.com/drive/folders/1LrHFMx3wfp1QutIinbWThIh9q0FaEPyI" },
        { name:"그루터기 10집", desc:"세계복음화전도협회에서 발매", year:"2010", url:"https://drive.google.com/drive/folders/1RWfItKDTha5j4TuvP1KHQ_r4qR9r-H68" },
        { name:"그루터기 9집", desc:"세계복음화전도협회에서 발매", year:"2009", url:"https://drive.google.com/drive/folders/14lhyMdEVK8J6shrhGhf28NA8DDtPbMfD" },
        { name:"그루터기 8집", desc:"세계복음화전도협회에서 발매", year:"2008", url:"https://drive.google.com/drive/folders/19bM_IDFIN3YGOghehpFmD3tx0zG8XHWG" },
        { name:"그루터기 라이브", desc:"", year:"", url:"https://drive.google.com/drive/folders/1jeFKJ09VQ73HhimQOSVUj8GlRhRjQ-pN" }
      ]},
      { key:"covenant", containerId:"audioCovenant", label:"언약과 꿈", items:[
        { name:"예수생명 best1", desc:"", year:"", url:"https://drive.google.com/drive/folders/15f5D0ImQd9r9Tg8BzmkKZs8QJwCIlZkP" },
        { name:"예수생명 best2", desc:"", year:"", url:"https://drive.google.com/drive/folders/1T0BtoMzyaID5zJ-RNzum_BlepekbSA4j" }
      ]},
      { key:"etc", containerId:"audioEtc", label:"기타", items:[] }
    ]
  }
};

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* items.txt 한 줄 형식: 항목|목록|발매연도|제목|설명|링크
   - 항목: 악보 / 교재 / 음원
   - 목록: 음원일 때만 사용 (그루터기 / 언약과꿈 / 기타), 나머지는 - 로 비워두기
   - 발매연도·설명: 없으면 - 로 비워두기
   - #으로 시작하는 줄과 빈 줄은 무시 (주석) */
function parseItemsTxt(text){
  const data = {
    sheetMusic: { items: [] },
    textbook: { items: [] },
    audio: { groups: [
      { key:'grooturgy', containerId:'audioGrooturgy', label:'그루터기', items:[] },
      { key:'covenant',  containerId:'audioCovenant',  label:'언약과 꿈', items:[] },
      { key:'etc',       containerId:'audioEtc',       label:'기타',     items:[] }
    ]}
  };
  const catKeyByLabel = { '악보':'sheetMusic', '교재':'textbook', '음원':'audio' };
  const groupKeyByLabel = { '그루터기':'grooturgy', '언약과꿈':'covenant', '기타':'etc' };

  text.split('\n').forEach((raw, idx) => {
    const line = raw.trim();
    if(!line || line.startsWith('#')) return;
    const parts = line.split('|').map(s => s.trim());
    if(parts.length !== 6){
      console.warn(`items.txt 줄 ${idx+1}: 필드가 6개가 아니라 건너뜀 → "${line}"`);
      return;
    }
    const [catRaw, groupRaw, yearRaw, name, descRaw, url] = parts;
    const cat = catKeyByLabel[catRaw];
    if(!cat || !name || !url){
      console.warn(`items.txt 줄 ${idx+1}: 형식 오류로 건너뜀 → "${line}"`);
      return;
    }
    const item = {
      name,
      desc: descRaw === '-' ? '' : descRaw,
      year: yearRaw === '-' ? '' : yearRaw,
      url,
      label: url.includes('drive.google.com') ? 'Download' : 'Go'
    };
    if(cat === 'audio'){
      const groupKey = groupKeyByLabel[groupRaw];
      const group = data.audio.groups.find(g => g.key === groupKey);
      if(!group){
        console.warn(`items.txt 줄 ${idx+1}: 알 수 없는 목록 '${groupRaw}' → 건너뜀`);
        return;
      }
      group.items.push(item);
    } else {
      data[cat].items.push(item);
    }
  });
  return data;
}

async function loadSiteData(){
  try{
    const res = await fetch(ITEMS_TXT_URL, { cache:'no-store' });
    if(res.ok){
      const text = await res.text();
      const parsed = parseItemsTxt(text);
      const total = parsed.sheetMusic.items.length + parsed.textbook.items.length
        + parsed.audio.groups.reduce((sum, g) => sum + g.items.length, 0);
      if(total > 0) SITE_DATA = parsed; // 빈 파일이면 기본 데이터 유지
    }
  }catch(err){
    console.warn('items.txt 로드 실패, 기본 데이터로 표시합니다:', err);
  }
  renderSimpleList();
}

/* ---------------- 패치 노트 ---------------- */
function tinyMarkdown(md){
  if(!md) return '';
  let html = escapeHtml(md);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^### (.*)$/gm, '<h4>$1</h4>').replace(/^## (.*)$/gm, '<h4>$1</h4>').replace(/^# (.*)$/gm, '<h4>$1</h4>');
  html = html.replace(/(^|\n)((?:[-*] .+(?:\n|$))+)/g, (m, pre, list) => {
    const items = list.trim().split('\n').map(l => `<li>${l.replace(/^[-*]\s+/, '')}</li>`).join('');
    return `${pre}<ul>${items}</ul>`;
  });
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  return html;
}

async function checkPatchNotes(){
  try{
    const res = await fetch(RELEASES_API, { cache:'no-store' });
    if(!res.ok) return; // 릴리즈가 아직 없거나, repo 미설정, rate limit 등
    const rel = await res.json();
    if(!rel || !rel.tag_name) return;

    let lastSeen = null;
    try{ lastSeen = localStorage.getItem(SEEN_RELEASE_KEY); }catch(e){}

    if(lastSeen === null){
      // 첫 방문 — 배너 없이 기준점만 저장
      try{ localStorage.setItem(SEEN_RELEASE_KEY, rel.tag_name); }catch(e){}
      return;
    }
    if(lastSeen !== rel.tag_name) showPatchNoteBanner(rel);
  }catch(err){
    // 네트워크 오류 등은 방문자에게 영향 없이 조용히 무시
  }
}

function showPatchNoteBanner(rel){
  const banner = document.getElementById('patchBanner');
  const backdrop = document.getElementById('patchBackdrop');
  document.getElementById('patchBannerTitle').textContent = rel.name || rel.tag_name;
  document.getElementById('patchBannerBody').innerHTML = tinyMarkdown(rel.body);
  banner.dataset.tag = rel.tag_name;
  banner.hidden = false;
  backdrop.hidden = false;
  requestAnimationFrame(() => { banner.classList.add('show'); backdrop.classList.add('show'); });
}

function dismissPatchNote(){
  const banner = document.getElementById('patchBanner');
  const backdrop = document.getElementById('patchBackdrop');
  if(banner.dataset.tag){
    try{ localStorage.setItem(SEEN_RELEASE_KEY, banner.dataset.tag); }catch(e){}
  }
  banner.classList.remove('show');
  backdrop.classList.remove('show');
  setTimeout(() => { banner.hidden = true; backdrop.hidden = true; }, 350);
}

/* ---------------- SIMPLE 모드 로직 ---------------- */
const simpleState = { tab:'sheetMusic', sub:null };

function sItemsFor(tab, sub){
  if(tab === 'audio'){
    const g = SITE_DATA.audio.groups.find(g => g.key === sub) || SITE_DATA.audio.groups[0];
    return g.items;
  }
  return SITE_DATA[tab].items;
}

function renderSimpleSubtabs(){
  const el = document.getElementById('sSubtabs');
  if(simpleState.tab !== 'audio'){ el.hidden = true; el.innerHTML=''; return; }
  if(!simpleState.sub) simpleState.sub = SITE_DATA.audio.groups[0].key;
  el.hidden = false;
  el.innerHTML = SITE_DATA.audio.groups.map(g =>
    `<button type="button" data-sub="${g.key}" class="${g.key===simpleState.sub?'active':''}">${escapeHtml(g.label)}</button>`
  ).join('');
}

function renderSimpleList(){
  renderSimpleSubtabs();
  const list = document.getElementById('sList');
  const items = sItemsFor(simpleState.tab, simpleState.sub);
  if(!items.length){
    list.innerHTML = '<li class="s-empty">아직 등록된 자료가 없습니다.</li>';
    return;
  }
  const showYear = items.some(it => it.year);
  list.innerHTML = items.map((it, i) => {
    return `
    <li class="s-item" style="--i:${i}">
      <div class="s-item-body">
        ${showYear ? `<span class="s-item-year">${it.year || ''}</span>` : ''}
        <div class="s-item-text">
          <div class="s-item-name">${escapeHtml(it.name)}</div>
          ${it.desc ? `<div class="s-item-desc">${escapeHtml(it.desc)}</div>` : ''}
        </div>
      </div>
      <a class="s-btn" href="${it.url}" target="_blank" rel="noopener">${it.label || 'Download'}</a>
    </li>`;
  }).join('');
}

document.getElementById('sTabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  simpleState.tab = btn.dataset.tab;
  if(simpleState.tab !== 'audio') simpleState.sub = null;
  document.querySelectorAll('#sTabs button').forEach(b => b.classList.toggle('active', b===btn));
  renderSimpleList();
});

document.getElementById('sSubtabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-sub]');
  if(!btn) return;
  simpleState.sub = btn.dataset.sub;
  renderSimpleList();
});

/* ---------------- 화면 전환 ---------------- */
function setMode(mode){
  document.getElementById('app-simple').classList.toggle('is-hidden', mode !== 'simple');
  document.getElementById('app-report').classList.toggle('is-hidden', mode !== 'report');
  const switcher = document.getElementById('modeSwitch');
  switcher.dataset.active = mode;
  switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
}

document.getElementById('modeSwitch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if(!btn) return;
  setMode(btn.dataset.mode);
});

/* ---------------- 초기화 ---------------- */
loadSiteData();
checkPatchNotes();
</script>
